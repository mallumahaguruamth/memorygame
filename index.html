<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flask + Three.js Cube</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand">
                Flask + Three.js
            </span>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container mt-4">

        <div class="row">

            <!-- Information -->

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h3 class="card-title">
                            3D Cube
                        </h3>

                        <p class="card-text">

                            This example demonstrates
                            a 3D cube using Flask
                            and Three.js.

                        </p>

                        <div class="alert alert-info">

                            The cube rotates automatically.

                        </div>

                    </div>

                </div>

            </div>


            <!-- 3D Cube -->

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-header bg-primary text-white">

                        3D Cube

                    </div>

                    <div class="card-body p-0">

                        <div
                            id="three-container"
                            style="width:100%; height:500px;">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Three.js -->

    <script type="module">

        import * as THREE
        from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


        // --------------------------------
        // Scene
        // --------------------------------

        const scene = new THREE.Scene();

        scene.background =
            new THREE.Color(0xf0f0f0);


        // --------------------------------
        // Container
        // --------------------------------

        const container =
            document.getElementById(
                "three-container"
            );


        // --------------------------------
        // Camera
        // --------------------------------

        const camera =
            new THREE.PerspectiveCamera(
                75,
                container.clientWidth /
                container.clientHeight,
                0.1,
                1000
            );


        camera.position.z = 5;


        // --------------------------------
        // Renderer
        // --------------------------------

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });


        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );


        renderer.setPixelRatio(
            window.devicePixelRatio
        );


        container.appendChild(
            renderer.domElement
        );


        // --------------------------------
        // Cube Geometry
        // --------------------------------

        const geometry =
            new THREE.BoxGeometry(
                2,
                2,
                2
            );


        // --------------------------------
        // Cube Material
        // --------------------------------

        const material =
            new THREE.MeshStandardMaterial({
                color: 0x007bff
            });


        // --------------------------------
        // Create Cube
        // --------------------------------

        const cube =
            new THREE.Mesh(
                geometry,
                material
            );


        scene.add(cube);


        // --------------------------------
        // Ambient Light
        // --------------------------------

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                0.6
            );

        scene.add(ambientLight);


        // --------------------------------
        // Directional Light
        // --------------------------------

        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                1
            );

        directionalLight.position.set(
            5,
            5,
            5
        );

        scene.add(directionalLight);


        // --------------------------------
        // Animation
        // --------------------------------

        function animate() {

            requestAnimationFrame(
                animate
            );


            // Rotate cube

            cube.rotation.x += 0.01;

            cube.rotation.y += 0.01;


            // Render

            renderer.render(
                scene,
                camera
            );

        }


        animate();


        // --------------------------------
        // Responsive
        // --------------------------------

        window.addEventListener(
            "resize",
            function() {

                camera.aspect =
                    container.clientWidth /
                    container.clientHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    container.clientWidth,
                    container.clientHeight
                );

            }
        );

    </script>

</body>

</html>
